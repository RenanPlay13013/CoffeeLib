plugins {
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

// mod_version/mod_group_id are the defaults; an injected -Pversion/-Pgroup wins, so a
// JitPack build publishes under the coordinates it serves (see the root build script).
version = providers.gradleProperty('version').getOrElse(mod_version)
group = providers.gradleProperty('group').getOrElse(mod_group_id)

base {
    // Not mod_id — that's "coffeelib" on every platform module by design, which
    // would make every one of them produce an identically named jar once they're
    // all copied into the same dist/ folder.
    archivesName = 'coffeelib-forge-1.20.1'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17) // Mojang ships Java 17 to end users in 1.18+.

minecraft {
    // official   MCVersion   Official field/method names from Mojang mapping files.
    // You must be aware of the Mojang license when using 'official' mappings:
    // https://github.com/MinecraftForge/MCPConfig/blob/master/Mojang.md
    mappings channel: mapping_channel, version: mapping_version

    // Required for ProcessResources to run on IDE output locations before launching the game.
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    // Only this module's own classes. api/core reach a dev run through
                    // minecraftLibrary instead: listing them in both places makes two JPMS
                    // modules export the same package and the run fails to resolve
                    // ("Modules coffeelib and coffeelib.api.SNAPSHOT export package ...").
                    source sourceSets.main
                }
            }
        }

        client {}

        server {
            args '--nogui'
        }
    }
}


// CoffeeLib's own jar runs code now — /coffeelib config lives in it — so the classes
// that code needs have to be inside it. A platform jar is loaded by the game as a mod,
// not resolved as a Maven module, so nothing brings coffeelib-api/core along: without
// this, the command dies with a ClassNotFoundException on ConfigReloadRegistry.
//
// Bundled from an explicit configuration rather than from runtimeClasspath, which here
// also holds Minecraft itself.
configurations {
    bundled
}

dependencies {
    api(project(":coffeelib-core"))

    // Minecraft already puts gson on the mod classpath, so shipping configurate's
    // older copy would only shadow it. configurate-yaml/-hocon need no exclusion:
    // they carry relocated SnakeYAML and typesafe-config inside themselves.
    bundled(project(":coffeelib-core")) {
        exclude group: 'com.google.code.gson'
    }

    // Dev runs: the mod is loaded from build/classes, so the bundling above does nothing
    // for them. ForgeGradle leaves a project's plain runtime dependencies on a classpath
    // the mod's own class loader cannot see — that was the tab-complete crash on
    // ConfigReloadRegistry — while everything in this configuration lands on the Minecraft
    // runtime classpath the loader does expose, the same place gson and guava come from.
    // NeoForge's equivalent is additionalRuntimeClasspath.
    // gson excluded for the same reason as in the bundle, and here it is not optional:
    // Minecraft puts its own gson on the module path, and a second copy makes the run
    // fail to resolve ("Modules gson and com.google.gson export package
    // com.google.gson.annotations").
    minecraftLibrary(project(":coffeelib-core")) {
        exclude group: 'com.google.code.gson'
    }

    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    testImplementation("org.mockito:mockito-core:5.14.2")
}

// ForgeGradle only wires the Forge/FML classpath onto the main source set;
// tests that touch ForgeConfigSpec/ModLoadingContext/etc. need it too.
sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: project.version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching('META-INF/mods.toml') {
        expand replaceProperties + [project: project]
    }
}

// reobfJar rewrites the jar in place after jar builds it, remapping to the SRG names a
// real Forge runtime patches. It is a finalizer of jar, not a dependency of whatever
// consumes the jar, so anything that copies or publishes the file has to wait for it
// explicitly or it can pick up the un-remapped one.
rootProject.tasks.named('assembleDist').configure {
    dependsOn tasks.named('reobfJar')
}

tasks.withType(AbstractPublishToMaven).configureEach {
    dependsOn tasks.named('reobfJar')
}

tasks.named('jar', Jar).configure {
    // The closure below hides where those files come from, so the dependency on the
    // sibling modules' own jar tasks is stated outright.
    dependsOn configurations.bundled

    from({ configurations.bundled.collect { it.isDirectory() ? it : zipTree(it) } }) {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/maven/**'
        // The multi-release copies are the same classes compiled for a newer JVM; the
        // root ones are complete on their own, and a stray module-info in a mod jar only
        // confuses the loader's own module scanning.
        exclude 'META-INF/versions/**'
        exclude 'module-info.class'
    }

    // Two bundled jars can both carry e.g. a LICENSE entry; the classes themselves
    // are distinct, so first-one-wins is the right call.
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    // Reobfuscates from official mappings back to the SRG names Forge's runtime patches expect.
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            // artifact jar, not from(components.java): this jar already contains
            // coffeelib-api, coffeelib-core and the Configurate backends, so declaring
            // them as POM dependencies too would put every one of those classes on a
            // consumer's classpath twice, once bundled and once resolved. A publication
            // built from an artifact rather than a component carries no dependency
            // metadata, which is exactly right for a self-contained jar.
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
