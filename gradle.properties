org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
# Deliberately off, and not a performance preference: ForgeGradle resolves the
# Minecraft artifact from its own MCPRepo *during dependency resolution*, and that
# step asks Gradle for a toolchain launcher. With projects building in parallel the
# resolution can run once the Forge project's services are already closed, and the
# build dies with
#   Could not create an instance of type ...DefaultToolchainSpec
#   Caused by: java.lang.IllegalStateException: project services has been closed
# followed by "Could not find net.minecraftforge:forge:<ver>_mapped_official_<mc>".
# It only shows up on a cold Minecraft cache, which is why it hit every JitPack
# build while local ones passed.
org.gradle.parallel=false
org.gradle.caching=true
